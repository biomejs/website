allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  sharp: false
  tombi: false
linkWorkspacePackages: true
minimumReleaseAgeExclude:
  - "@astrojs/mdx@7.0.3"
  - "@astrojs/netlify@8.1.2"
  - "@biomejs/*"
overrides:
  satteri: 0.10.5
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      # Match the @emnapi/core version used by astro2tsx.
      "@emnapi/runtime": 1.11.3
packages:
  - "scripts"
  - "packages/*"
  - "./"
supportedArchitectures:
  cpu:
    - current
    - wasm32
