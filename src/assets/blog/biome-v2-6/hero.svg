<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Biome v2.6 mascot beside a fan of language cards</title>
  <desc>The Biome mascot Cookie looks at five playing cards featuring the Markdown, Sass, YAML, Tailwind CSS, and JavaScript symbols, above a Biome v2.6 label.</desc>

