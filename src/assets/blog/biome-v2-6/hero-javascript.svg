      </g>
      <text x="94" y="238" text-anchor="middle" fill="#151515" font-size="20" font-weight="800">Sass</text>
      <circle cx="29" cy="247" r="5" fill="#CC6699"/>
      <circle cx="159" cy="31" r="5" fill="#CC6699"/>
    </g>

    <!-- YAML -->
    <g transform="translate(350 108) rotate(-1 94 220)" filter="url(#dim-card)">
      <rect width="188" height="278" rx="20" fill="#F6F6F9" stroke="#60A5FA" stroke-width="4"/>
      <rect x="10" y="10" width="168" height="258" rx="13" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
      <text x="22" y="38" fill="#CB171E" fill-opacity="0.72" font-size="17" font-weight="750">.yaml</text>
      <g transform="translate(51 61) scale(3.58)" fill="#CB171E">
        <path d="m0 .97 4.111 6.453v4.09h2.638v-4.09L11.053.969H8.214L5.58 5.125 2.965.969Zm12.093.024-4.47 10.544h2.114l.97-2.345h4.775l.804 2.345h2.26L14.255.994Zm1.133 2.225 1.463 3.87h-3.096zm3.06 9.475v10.29H24v-2.199h-5.454v-8.091zm-12.175.002v10.335h2.217v-7.129l2.32 4.792h1.746l2.4-4.96v7.295h2.127V12.696h-2.904L9.44 17.37l-2.455-4.674Z"/>
      </g>
      <text x="94" y="238" text-anchor="middle" fill="#151515" font-size="20" font-weight="800">YAML</text>
      <circle cx="29" cy="247" r="5" fill="#CB171E"/>
      <circle cx="159" cy="31" r="5" fill="#CB171E"/>
    </g>

    <!-- Tailwind CSS -->
    <g transform="translate(493 130) rotate(8 94 220)" filter="url(#dim-card)">
      <rect width="188" height="278" rx="20" fill="#F6F6F9" stroke="#60A5FA" stroke-width="4"/>
      <rect x="10" y="10" width="168" height="258" rx="13" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
      <text x="22" y="38" fill="#06B6D4" fill-opacity="0.78" font-size="17" font-weight="750">.css</text>
      <g transform="translate(48 72) scale(3.83)" fill="#06B6D4">
        <path d="M12.001 4.8c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624C13.666 10.618 15.027 12 18.001 12c3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C16.337 6.182 14.976 4.8 12.001 4.8zM6.001 12c-3.2 0-5.2 1.6-6 4.8 1.2-1.6 2.6-2.2 4.2-1.8.913.228 1.565.89 2.288 1.624 1.177 1.194 2.538 2.576 5.512 2.576 3.2 0 5.2-1.6 6-4.8-1.2 1.6-2.6 2.2-4.2 1.8-.913-.228-1.565-.89-2.288-1.624C10.337 13.382 8.976 12 6.001 12z"/>
      </g>
      <text x="94" y="238" text-anchor="middle" fill="#151515" font-size="20" font-weight="800">Tailwind</text>
      <circle cx="29" cy="247" r="5" fill="#06B6D4"/>
      <circle cx="159" cy="31" r="5" fill="#06B6D4"/>
    </g>

    <!-- JavaScript -->
    <g transform="translate(635 155) rotate(15 94 220)" filter="url(#selected-card-glow)">
      <rect width="188" height="278" rx="20" fill="#F6F6F9" stroke="#F7DF1E" stroke-width="7"/>
      <rect x="10" y="10" width="168" height="258" rx="13" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
      <text x="22" y="38" fill="#151515" fill-opacity="0.55" font-size="17" font-weight="750">.js</text>
      <rect x="48" y="59" width="92" height="92" fill="#151515"/>
      <g transform="translate(48 59) scale(3.833333)" fill="#F7DF1E">
        <path d="M0 0h24v24H0V0zm22.034 18.276c-.175-1.095-.888-2.015-3.003-2.873-.736-.345-1.554-.585-1.797-1.14-.091-.33-.105-.51-.046-.705.15-.646.915-.84 1.515-.66.39.12.75.42.976.9 1.034-.676 1.034-.676 1.755-1.125-.27-.42-.404-.601-.586-.78-.63-.705-1.469-1.065-2.834-1.034l-.705.089c-.676.165-1.32.525-1.71 1.005-1.14 1.291-.811 3.541.569 4.471 1.365 1.02 3.361 1.244 3.616 2.205.24 1.17-.87 1.545-1.966 1.41-.811-.18-1.26-.586-1.755-1.336l-1.83 1.051c.21.48.45.689.81 1.109 1.74 1.756 6.09 1.666 6.871-1.004.029-.09.24-.705.074-1.65l.046.067zm-8.983-7.245h-2.248c0 1.938-.009 3.864-.009 5.805 0 1.232.063 2.363-.138 2.711-.33.689-1.18.601-1.566.48-.396-.196-.597-.466-.83-.855-.063-.105-.11-.196-.127-.196l-1.825 1.125c.305.63.75 1.172 1.324 1.517.855.51 2.004.675 3.207.405.783-.226 1.458-.691 1.811-1.411.51-.93.402-2.07.397-3.346.012-2.054 0-4.109 0-6.179l.004-.056z"/>
