    <g transform="translate(207 130) rotate(-8 94 220)" filter="url(#dim-card)">
      <rect width="188" height="278" rx="20" fill="#F6F6F9" stroke="#60A5FA" stroke-width="4"/>
      <rect x="10" y="10" width="168" height="258" rx="13" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
      <text x="22" y="38" fill="#CC6699" fill-opacity="0.72" font-size="17" font-weight="750">.scss</text>
      <g transform="translate(51 63) scale(3.58)" fill="#CC6699">
