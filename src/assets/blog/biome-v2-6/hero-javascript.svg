<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>JavaScript highlighted in a fan of language cards</title>
  <desc>The Biome mascot Cookie looks at five playing cards. The JavaScript card is highlighted and raised.</desc>

  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#F6F6F9" fill-opacity="0.14"/>
    </pattern>
    <filter id="card-shadow" x="-35%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="selected-card-glow" x="-35%" y="-35%" width="170%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="0" stdDeviation="9" flood-color="#F7DF1E" flood-opacity="0.9"/>
    </filter>
    <filter id="dim-card" x="-5%" y="-5%" width="110%" height="110%" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.58" intercept="0.035"/>
        <feFuncG type="linear" slope="0.58" intercept="0.035"/>
        <feFuncB type="linear" slope="0.58" intercept="0.035"/>
        <feFuncA type="identity"/>
      </feComponentTransfer>
    </filter>
    <filter id="mascot-shadow" x="-30%" y="-30%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="13" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Biome brand background -->
  <rect width="1200" height="630" fill="#151515"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  <circle cx="1085" cy="105" r="315" fill="#60A5FA" fill-opacity="0.08"/>
  <circle cx="105" cy="620" r="300" fill="#60A5FA" fill-opacity="0.06"/>
  <path d="M-35 525C181 430 310 575 514 492C711 412 834 371 1236 443" stroke="#60A5FA" stroke-opacity="0.18" stroke-width="3"/>
  <path d="M-30 551C183 456 318 599 521 517C715 438 865 394 1235 467" stroke="#60A5FA" stroke-opacity="0.09" stroke-width="2"/>

  <!-- Small celebratory marks -->
  <g fill="#60A5FA">
    <path d="M91 97H103V109H91V97Z" transform="rotate(45 97 103)"/>
    <path d="M818 88H830V100H818V88Z" transform="rotate(45 824 94)"/>
    <circle cx="65" cy="145" r="5"/>
    <circle cx="851" cy="143" r="4"/>
  </g>
  <g stroke="#F6F6F9" stroke-linecap="round" stroke-opacity="0.72">
    <path d="M748 69V91M737 80H759" stroke-width="5"/>
    <path d="M1100 183V201M1091 192H1109" stroke-width="4"/>
  </g>

  <!-- Ground shadows -->
  <ellipse cx="1029" cy="584" rx="171" ry="22" fill="#000000" fill-opacity="0.42"/>
  <ellipse cx="477" cy="526" rx="389" ry="31" fill="#000000" fill-opacity="0.2"/>

  <!-- Cookie, Biome's basic mascot, reproduced from the official resource -->
  <g transform="translate(875 300) scale(4.7)" filter="url(#mascot-shadow)">
    <path d="M34.4551 0.600005L19.2599 26.9419C25.0288 25.1609 31.2356 24.8948 37.2533 26.3116L42.3926 27.5227L37.5655 48.0259L32.4187 46.8148C26.0935 45.3253 20.0162 48.65 17.4497 53.9514L12.692 51.6519C16.3194 44.1528 24.873 39.6098 33.6333 41.673L36.0394 31.4545C27.4053 29.4225 18.3072 31.4517 11.3536 36.9605C4.4006 42.468 0.341325 50.8613 0.344743 59.7317L68.6114 59.7063L34.4551 0.600005Z" fill="#60A5FA"/>
    <ellipse cx="19.5" cy="17" rx="7.5" ry="11" fill="#D9D9D9"/>
    <path d="M21 17C21 19.7614 19.433 22 17.5 22C15.567 22 14 19.7614 14 17C14 14.2386 15.567 12 17.5 12C19.433 12 21 14.2386 21 17Z" fill="#000000"/>
    <circle cx="16.5" cy="15.5" r="0.5" fill="#D9D9D9"/>
    <ellipse cx="46.5" cy="18" rx="7.5" ry="11" fill="#D9D9D9"/>
    <path d="M48 17C48 19.7614 46.433 22 44.5 22C42.567 22 41 19.7614 41 17C41 14.2386 42.567 12 44.5 12C46.433 12 48 14.2386 48 17Z" fill="#000000"/>
    <circle cx="42.5" cy="16.5" r="0.5" fill="#D9D9D9"/>
  </g>

  <!-- Five cards for the five requested technologies. Icons use the official Simple Icons paths. -->
  <g filter="url(#card-shadow)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <!-- Markdown -->
    <g transform="translate(65 177) rotate(-15 94 220)" filter="url(#dim-card)">
      <rect width="188" height="278" rx="20" fill="#F6F6F9" stroke="#60A5FA" stroke-width="4"/>
      <rect x="10" y="10" width="168" height="258" rx="13" stroke="#151515" stroke-opacity="0.12" stroke-width="2"/>
      <text x="22" y="38" fill="#151515" fill-opacity="0.55" font-size="17" font-weight="750">.md</text>
      <g transform="translate(50 69) scale(3.66)" fill="#151515">
        <path d="M22.27 19.385H1.73A1.73 1.73 0 010 17.655V6.345a1.73 1.73 0 011.73-1.73h20.54A1.73 1.73 0 0124 6.345v11.308a1.73 1.73 0 01-1.73 1.731zM5.769 15.923v-4.5l2.308 2.885 2.307-2.885v4.5h2.308V8.078h-2.308l-2.307 2.885-2.308-2.885H3.46v7.847zM21.232 12h-2.309V8.077h-2.307V12h-2.308l3.461 4.039z"/>
      </g>
      <text x="94" y="238" text-anchor="middle" fill="#151515" font-size="20" font-weight="800">Markdown</text>
      <circle cx="29" cy="247" r="5" fill="#151515"/>
      <circle cx="159" cy="31" r="5" fill="#151515"/>
    </g>

